name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify committed dataset checksums
        run: python scripts/verify_manifests.py

      - name: Byte-compile Python
        run: python -m compileall -q app engines tests

      - name: Frontend syntax check
        run: node --check web/js/app.bundle.js

      - name: Run tests
        run: pytest -q
